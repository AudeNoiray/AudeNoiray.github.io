name: Format and Commit

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    name: Run Prettier and commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pin Ubuntu runners and run Prettier
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          for pattern in ("*.yml", "*.yaml"):
              for workflow in Path(".github/workflows").glob(pattern):
                  original = workflow.read_text()
                  updated = original.replace("ubuntu-latest", "ubuntu-26.04")
                  if updated != original:
                      workflow.write_text(updated)
                      print(f"Updated runner label in {workflow}")
          PY

          FILES=(
            "_data/coauthors.yml"
            "_layouts/about.liquid"
            "_layouts/bib.liquid"
            "_layouts/post.liquid"
            "_news/ICIS_2026.md"
            "_news/Job post.md"
            "_news/voc2speak.md"
            "_pages/about.md"
            "_pages/team/anjalilepain.md"
            "_pages/team/elinarubertus.md"
            "_pages/team/luciechasseur.md"
            "_projects/methodologies.md"
            "_projects/pathological_speech.md"
            "_projects/relation_speech_and_reading.md"
            "_sass/_base.scss"
            "assets/js/distillpub/transforms.v2.js"
            "assets/json/resume.json"
            "USER_MANUAL.md"
          )
          EXISTING_FILES=()
          for file in "${FILES[@]}"; do
            if [[ -f "$file" ]]; then
              EXISTING_FILES+=("$file")
            else
              echo "::warning::Skipping missing Prettier target: $file"
            fi
          done

          if ((${#EXISTING_FILES[@]})); then
            npx prettier --write "${EXISTING_FILES[@]}"
          else
            echo "No configured Prettier targets exist; continuing with runner updates."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No runner or formatting changes to commit."
            exit 0
          fi

          git commit -m "ci: pin Ubuntu runners and apply Prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
